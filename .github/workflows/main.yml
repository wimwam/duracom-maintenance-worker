name: Build Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: |
          mkdir duracom-maintenance-worker

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='duracom-maintenance-worker' \
            ./ duracom-maintenance-worker/

          zip -r \
            "duracom-maintenance-worker-${GITHUB_REF_NAME}.zip" \
            duracom-maintenance-worker

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: duracom-maintenance-worker-${{ github.event.release.tag_name }}.zip
